name: PosterCut
options:
  bundleIdPrefix: com.mosaika
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  PosterCut:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PosterCut
        excludes:
          - Resources/Info.plist
          - Resources/PosterCut.entitlements
    info:
      path: PosterCut/Resources/Info.plist
    entitlements:
      path: PosterCut/Resources/PosterCut.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mosaika.postercut
        PRODUCT_NAME: PosterCut
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: PosterCut/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PosterCut/Resources/PosterCut.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
